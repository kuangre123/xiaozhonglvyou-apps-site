<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Inkstone social preview source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #f5f8f7; color: #172323; font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
    main { display: grid; grid-template-columns: 660px 1fr; gap: 72px; width: 1200px; height: 630px; padding: 39px 64px; }
    .copy { display: flex; flex-direction: column; align-items: flex-start; padding: 16px 0 14px; }
    .brand { display: flex; align-items: center; gap: 20px; }
    .brand img { display: block; width: 64px; height: 64px; border-radius: 8px; }
    .platform { font-size: 21px; font-weight: 700; color: #42645b; }
    h1 { margin: 32px 0 20px; font-size: 64px; line-height: 1.05; font-weight: 700; }
    .lead { margin: 0; font-size: 31px; line-height: 1.3; }
    .features { margin-top: 34px; padding-left: 18px; border-left: 4px solid #39836e; }
    .features p { margin: 0 0 11px; font-size: 24px; line-height: 1.2; }
    .features p:last-child { margin-bottom: 0; }
    .site { margin: auto 0 0; color: #5b6a65; font-size: 20px; }
    .screen { margin: 0; display: flex; align-items: center; justify-content: center; }
    .screen img { display: block; width: 254px; height: 552px; object-fit: contain; border: 1px solid #d9e1dd; border-radius: 8px; background: white; }
  </style>
</head>
<body>
  <!-- Render this source at 1200x630; the app images remain original assets. -->
  <main>
    <div class="copy">
      <div class="brand"><img src="../assets/inkstone-icon.webp" alt="Inkstone icon"><span class="platform">Markdown writing on iPhone</span></div>
      <h1>Inkstone<br>Notes Markdown</h1>
      <p class="lead">Your notes stay .md files.</p>
      <div class="features"><p>iCloud Drive</p><p>Wiki links and backlinks</p><p>PDF and HTML export</p></div>
      <p class="site">xiaozhonglvyou.com</p>
    </div>
    <figure class="screen"><img src="../assets/inkstone-editor-screen.webp" alt="Real Inkstone iPhone editor screenshot" width="520" height="1130"></figure>
  </main>
</body>
</html>
